name: Adminer upgrade
on:
  pull_request:
    paths:
      - 'runtime/service_images.py'
      - 'runtime/compose.yaml'
      - 'runtime/app.py'
      - 'runtime/tests/integration/adminer_upgrade.py'
      - '.github/workflows/adminer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adminer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.65.1
          sudo "$(command -v python)" -m playwright install --with-deps chromium
      - name: Verify real Adminer migration, CSRF login and rollback
        run: sudo env SPAWNWP_TEST_BROWSER=1 "$(command -v python)" runtime/tests/integration/adminer_upgrade.py
