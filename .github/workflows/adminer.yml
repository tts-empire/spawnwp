name: Adminer upgrade
on:
  pull_request:
    paths:
      - 'runtime/service_images.py'
      - 'runtime/compose.yaml'
      - 'runtime/app.py'
      - 'runtime/tests/integration/adminer_upgrade.py'
      - '.github/workflows/adminer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adminer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify real Adminer migration, CSRF login and rollback
        run: sudo python3 runtime/tests/integration/adminer_upgrade.py
