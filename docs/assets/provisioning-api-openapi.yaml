openapi: 3.1.0
info:
  title: SpawnWP Provisioning API
  version: "1"
  description: Signed API for creating short-lived WordPress sites.
servers:
  - url: https://{cockpitHost}
    variables:
      cockpitHost:
        default: spawnwp.example.com
security:
  - SpawnWPSignature: []
paths:
  /api/provision/status:
    get:
      summary: Inspect the connection and its active sites
      operationId: provisioningStatus
      responses:
        "200":
          description: Current connection status and capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WrongScope"
  /api/provision:
    post:
      summary: Create a temporary WordPress site
      operationId: provisionSite
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._:-]{8,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: The site and access metadata; credentials when requested
          headers:
            Idempotent-Replayed:
              description: Present and true when returning a stored result.
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WrongScope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidBody"
        "429":
          $ref: "#/components/responses/RateLimited"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/provision/connection:
    delete:
      summary: Revoke the calling connection
      operationId: revokeProvisioningConnection
      responses:
        "200":
          description: Connection revoked; existing sites are preserved
          content:
            application/json:
              schema:
                type: object
                required: [status, active_sites]
                properties:
                  status:
                    type: string
                    const: revoked
                  active_sites:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WrongScope"
  /api/provision/sites/{project}/magic-link:
    post:
      summary: Mint a short-lived admin link for an owned managed site
      operationId: mintProvisionedSiteMagicLink
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single-use link expiring after two minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WrongScope"
        "404":
          description: The active site does not belong to this connection
        "409":
          description: The site does not use managed credentials or has no managed user
        "410":
          description: The site has expired
components:
  securitySchemes:
    SpawnWPSignature:
      type: apiKey
      in: header
      name: X-SpawnWP-Signature
      description: |
        This signature is accompanied by X-SpawnWP-Connection,
        X-SpawnWP-Timestamp, and X-SpawnWP-Nonce. See the integration guide.
  schemas:
    ProvisionRequest:
      type: object
      required: [blueprint]
      additionalProperties: false
      properties:
        blueprint:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,30}$"
          description: Blueprint identifier, not a display name.
        expires_seconds:
          type: integer
          minimum: 300
          maximum: 31536000
          default: 3600
        role:
          type: string
          enum: [administrator, editor, author, contributor, subscriber]
          default: administrator
        group:
          type: string
          default: API
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._\\-]{0,31}$"
          maxLength: 32
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,30}$"
          description: Optional project and URL slug. Omit it to generate a random name.
        access_profile:
          type: string
          enum: [standard, restricted-admin]
          default: standard
          description: restricted-admin installs a capability guard suitable for product demos.
        credentials_mode:
          type: string
          enum: [return, managed]
          default: return
          description: managed omits reusable credentials and the initial magic link.
    ProvisionResult:
      type: object
      required: [project, url, expires_at, username]
      properties:
        project:
          type: string
        url:
          type: string
          format: uri
        expires_at:
          type: integer
          description: Unix timestamp.
        username:
          type: string
        password:
          type: string
          format: password
          description: Present only when credentials_mode is return.
        magic_link:
          type: string
          format: uri
          description: May be present only when credentials_mode is return.
    MagicLinkResult:
      type: object
      required: [project, url, expires_in]
      properties:
        project:
          type: string
        url:
          type: string
          format: uri
        expires_in:
          type: integer
          const: 120
    BlueprintSummary:
      type: object
      required: [id, name, version, source]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        source:
          type: string
    ProvisionSite:
      type: object
      required: [project, url, status, expires_at, created_at]
      properties:
        project:
          type: string
        url:
          type: string
        status:
          type: string
        expires_at:
          type: integer
        created_at:
          type: integer
    ProvisionStatus:
      type: object
      required:
        - api_version
        - spawnwp_version
        - connection
        - defaults
        - limits
        - active_sites
        - sites
        - blueprints
      properties:
        api_version:
          type: integer
          const: 1
        spawnwp_version:
          type: string
        connection:
          type: object
          required: [id, label, scope]
          properties:
            id:
              type: string
            label:
              type: string
            scope:
              type: string
              const: provision
        defaults:
          type: object
          properties:
            expires_seconds:
              type: integer
            role:
              type: string
            group:
              type: string
            access_profile:
              type: string
              enum: [standard, restricted-admin]
              default: standard
            credentials_mode:
              type: string
              enum: [return, managed]
              default: return
        limits:
          type: object
          properties:
            min_expires_seconds:
              type: integer
            max_expires_seconds:
              type: integer
            concurrent_sites:
              type: integer
            provision_timeout_seconds:
              type: integer
        active_sites:
          type: integer
        sites:
          type: array
          items:
            $ref: "#/components/schemas/ProvisionSite"
        blueprints:
          type: array
          description: Blueprints currently available to the paired integration.
          items:
            $ref: "#/components/schemas/BlueprintSummary"
    Error:
      type: object
      required: [detail]
      properties:
        detail: {}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid signed credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WrongScope:
      description: A provisioning connection is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency, nonce, quota, or operation conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidBody:
      description: Request body validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InsufficientStorage:
      description: Insufficient free disk space
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
