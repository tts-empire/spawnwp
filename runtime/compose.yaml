name: ${COMPOSE_PROJECT_NAME:-wp-dev}

services:

  nginx:
    image: ${NGINX_IMAGE_REF:-nginx:1.30.6-alpine3.24@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ./projects/primary/wp-content:/var/www/html/wp-content
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - internal
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      # 60s, matching php: on a first start nginx cannot serve anything until the
      # php entrypoint has finished extracting WordPress into the empty volume.
      # With the old 10s grace this probe could burn its retries first and the
      # container came up "unhealthy", failing the deploy.
      start_period: 60s

  php:
    # Images are prepared and verified by prepare-image.py. Compose never builds
    # directly into an immutable site reference or implicitly pulls a missing one.
    pull_policy: never
    # The tag carries the WordPress version because the image CONTENT does: the
    # Dockerfile bakes WORDPRESS_VERSION into /usr/src/wordpress. Keyed on PHP
    # alone, a `latest` site and one pinning WP 7.0.1 shared this single mutable
    # tag and re-tagged it from under each other — rebuilding forever, and
    # occasionally bringing a recreated site back up on another site's core.
    # WP_IMAGE_SUFFIX lives in .env (written by new-project.sh) so that every
    # entry point — make up, php-switch, the cockpit — resolves the same tag.
    image: ${PHP_IMAGE_REF:-wp-dev-php:${PHP_VERSION:-8.3}${WP_IMAGE_SUFFIX:-}}
    restart: unless-stopped
    extra_hosts:
      - "${DOMAIN:-dev.example.com}:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - wp_data:/var/www/html
      - ./projects/primary/wp-content:/var/www/html/wp-content
      # Per-site PHP overrides (cockpit "PHP settings"): conf.d loads alphabetically,
      # so zz- wins over the baked custom.ini without rebuilding the shared image.
      - ./docker/php/zz-site.ini:/usr/local/etc/php/conf.d/zz-site.ini:ro
      - ./docker/php/zz-xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
      # Leave WORDPRESS_DEBUG EMPTY (not "false") when debug is off: the image's
      # wp-config does define('WP_DEBUG', !!getenv_docker('WORDPRESS_DEBUG','')),
      # and !!"false" is TRUE. The image ignores WORDPRESS_DEBUG_LOG/DISPLAY, so
      # WP_DEBUG_LOG/DISPLAY are set below in WORDPRESS_CONFIG_EXTRA instead.
      WORDPRESS_DEBUG: "${WP_DEBUG:-}"
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        // Debug logs to wp-content/debug.log; on-screen display follows the
        // php.ini display_errors (the Deploy "display_errors" dev toggle) rather
        // than WordPress's default-on, so a stray plugin notice never breaks the
        // page by emitting output before headers.
        if (!defined('WP_DEBUG_LOG')) { define('WP_DEBUG_LOG', true); }
        if (!defined('WP_DEBUG_DISPLAY')) { define('WP_DEBUG_DISPLAY', null); }
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');
        define('SPAWNWP_DEPLOY_HEALTHCHECK_URL', 'http://nginx/');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        // Subpath via reverse proxy: the host nginx strips the prefix and
        // re-sends it in X-Forwarded-Prefix. We rebuild REQUEST_URI so redirects
        // (login) and permalinks include the /site prefix.
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PREFIX'])) {
          $$__pfx = rtrim($$_SERVER['HTTP_X_FORWARDED_PREFIX'], '/');
          if (isset($$_SERVER['REQUEST_URI']) && strpos($$_SERVER['REQUEST_URI'], $$__pfx . '/') !== 0) {
            $$_SERVER['REQUEST_URI'] = $$__pfx . $$_SERVER['REQUEST_URI'];
          }
        }
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${SPAWNWP_PHP_CONTAINER_MEMORY:-512M}
    healthcheck:
      test: ["CMD-SHELL", "if command -v fpm-healthcheck >/dev/null 2>&1; then fpm-healthcheck; else php-fpm -t; fi"]
      interval: 15s
      timeout: 10s
      retries: 3
      # 60s: the first run extracts the whole WP install into the empty volume;
      # under that I/O load the healthcheck may time out, and nginx (which
      # depends on php being healthy) would give up. Wide margin for the first time.
      start_period: 60s

  db:
    image: ${MARIADB_IMAGE_REF:-mariadb:10.11@sha256:5a5c675881ef3fd1c1da9b0a3bfd6ee82edbe39cd9e32e06be18034c37235e0e}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/spawnwp.cnf:/etc/mysql/conf.d/spawnwp.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    networks:
      - internal
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailpit:
    image: ${MAILPIT_IMAGE_REF:-axllent/mailpit@sha256:37a38e48e9338cd7e89dfeb487f37b02ebfcd9cb23111bed2d345e79d37d6dd6}
    restart: unless-stopped
    environment:
      # Persistence: mail survives restart/reboot (SQLite on a volume)
      MP_DATABASE: /data/mailpit.db
      # Retention: message cap + max age (auto-cleanup)
      MP_MAX_MESSAGES: "2000"
      MP_MAX_AGE: "72h"
      # Webroot: serves the UI under the site subpath (e.g. /bellu-mail) so it can
      # be exposed behind Nginx without breaking the assets. Empty = root.
      MP_WEBROOT: ${MAILPIT_WEBROOT:-}
    volumes:
      - mailpit_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      # readyz lives under the webroot when MP_WEBROOT is set
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025$${MP_WEBROOT}/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  adminer:
    image: ${ADMINER_IMAGE_REF:-adminer:5@sha256:87f9aeeef91638f5bc150bb6490a4fd85d071f458f38dcc8171a640e1751d29b}
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - internal
    ports:
      - "127.0.0.1:${ADMINER_PORT:-9001}:8080"
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 48M
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',8080)?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    user: redis
    image: ${REDIS_IMAGE_REF:-redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    profiles: [redis]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 160M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  wp_data:
  db_data:
  mailpit_data:

networks:
  internal:
    driver: bridge
